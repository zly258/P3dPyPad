<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Plant 3D PyOCC 仿真工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232563eb'/><text x='16' y='21' font-size='15' font-weight='bold' text-anchor='middle' fill='white'>P</text></svg>">
  
  <!-- Google Fonts: Inter (现代精细无衬线界面字体) + JetBrains Mono (专业开发者/工程等宽字体) + Noto Sans SC (全量简体中文字体) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="./src/style.css?v=20261124_02">

  <!-- ES Module 本地依赖导入映射表 -->
  <script type="importmap">
  {
    "imports": {
      "three": "./public/libs/three.module.js",
      "three/addons/": "./public/libs/"
    }
  }
  </script>
</head>
<body>
  <!-- 顶部标题栏 (极简紧凑设计，无冗余文字，无图标) -->
  <header class="md-app-bar">
    <div class="md-brand">
      <div id="brand-title" class="md-brand-title">Plant 3D PyOCC 仿真工作台</div>
      <span class="md-chip md-chip-accent">OpenCASCADE 8.0.1 WASM</span>
    </div>
    <div class="md-segmented-group" id="lang-switcher">
      <button id="btn-lang-zh" class="md-segmented-item active" title="切换到中文">中文</button>
      <button id="btn-lang-en" class="md-segmented-item" title="Switch to English">English</button>
    </div>
  </header>

  <!-- 工作区主布局 -->
  <main class="md-workspace">
    <!-- 左侧：参数化构件代码与属性控制面板 (支持案例预览模式与代码测试模式双模式切换) -->
    <aside class="md-side-panel">
      <!-- 模式切换栏 (案例预览模式 / 代码测试模式) -->
      <div class="md-mode-bar">
        <div class="md-segmented-group" id="mode-switcher" style="width: 100%;">
          <button id="btn-mode-preview" class="md-segmented-item active" style="flex: 1;" title="预览现有构件库三维模型 (点击即看外形)">案例预览模式</button>
          <button id="btn-mode-editor" class="md-segmented-item" style="flex: 1;" title="自主编写与调试 Python 代码 (带语法高亮)">代码测试模式</button>
        </div>
      </div>

      <!-- 模式一：案例预览模式 (Tree 树状目录浏览，点击即显示外形) -->
      <div id="preview-mode-view" class="md-mode-view">
        <div class="md-tree-toolbar">
          <input id="tree-search" type="text" class="md-text-field" placeholder="搜索案例 (如 弯头 / 阀门 / CD)..." style="flex: 1;" title="输入构件位号或中文关键字即时过滤" />
          <button id="btn-tree-collapse" class="md-btn-tool" title="全部折叠">折叠</button>
          <button id="btn-tree-expand" class="md-btn-tool" title="全部展开">展开</button>
        </div>
        <div id="script-tree-container" class="md-tree-container">
          <!-- 动态渲染树状结构：分类节点与构件叶子节点 -->
        </div>
        <div class="md-preview-footer">
          <div class="md-preview-info">
            <div id="preview-comp-title" class="md-preview-name">-</div>
            <div id="preview-comp-meta" class="md-preview-meta">-</div>
          </div>
          <button id="btn-switch-to-edit" class="md-button md-button-outlined md-btn-sm" title="切换到代码测试模式编辑当前构件">
            编辑代码
          </button>
        </div>
      </div>

      <!-- 模式二：代码测试模式 (自主编写代码、带语法高亮、参数调节与执行) -->
      <div id="editor-mode-view" class="md-mode-view hidden">
        <!-- 构件模板选择与快捷操作栏 -->
        <div class="md-panel-header">
          <div style="display: flex; gap: 8px; width: 100%;">
            <select id="preset-select" class="md-select" style="flex: 1;" title="选择构件代码模板">
              <!-- 动态注入 pyscripts 构件选项 -->
            </select>
            <button id="btn-run" class="md-button md-button-primary" title="执行脚本建模 (快捷键 F5 或 Ctrl+Enter)">
              运行 (F5)
            </button>
            <button id="btn-reset" class="md-button md-button-outlined" title="重置代码">
              重置
            </button>
          </div>
        </div>

        <!-- Python 代码编辑器 (带彩色语法高亮) -->
        <div class="md-editor-box">
          <div class="md-section-label" style="display: flex; justify-content: space-between; align-items: center;">
            <span id="lbl-code">Python 源码</span>
            <span class="md-editor-hint">Tab 缩进 · F5 运行</span>
          </div>
          <div class="md-editor-container" id="editor-container">
            <pre class="md-code-backdrop" aria-hidden="true"><code id="code-highlight" class="language-python"></code></pre>
            <textarea id="code-editor" class="md-code-input" spellcheck="false" placeholder="在此输入或修改 AutoCAD Plant 3D 构件 Python 脚本代码..."></textarea>
          </div>
        </div>

        <!-- 动态解析尺寸参数网格 -->
        <div class="md-params-box">
          <div id="lbl-params" class="md-section-label">尺寸参数</div>
          <div id="param-container" class="md-param-list">
            <!-- 动态解析渲染参数行 -->
          </div>
        </div>
      </div>
    </aside>

    <!-- 右侧：Three.js 三维视口与预览图生成区 -->
    <section class="md-viewport-panel">
      <!-- 视口顶部工具栏 (纯文本分段按钮组，零图标) -->
      <div class="md-viewport-toolbar">
        <div class="md-toolbar-cluster">
          <div class="md-segmented-group">
            <button id="btn-iso" class="md-segmented-item active" title="正交等轴测视角">轴测</button>
            <button id="btn-top" class="md-segmented-item" title="正交俯视图">俯视</button>
            <button id="btn-front" class="md-segmented-item" title="正交正视图">正视</button>
            <button id="btn-side" class="md-segmented-item" title="正交侧视图">侧视</button>
            <button id="btn-fit" class="md-segmented-item" title="视口居中缩放">居中</button>
          </div>
        </div>

        <div class="md-toolbar-cluster">
          <select id="render-mode-select" class="md-select-sm" title="切换渲染模式">
            <option value="shaded_edges" selected>着色边线</option>
            <option value="shaded">实体着色</option>
            <option value="wireframe">线框模式</option>
          </select>

          <select id="color-select" class="md-select-sm" title="构件材质颜色">
            <option value="#388bfd" selected>工程蓝</option>
            <option value="#64748b">工业灰</option>
            <option value="#0d9488">钢青色</option>
            <option value="#ea580c">机械橙</option>
            <option value="#16a34a">设备绿</option>
          </select>

          <!-- 生成预览图按钮 -->
          <button id="btn-snapshot" class="md-button md-button-accent" title="一键生成高精度轴测预览图 (PNG)">
            生成预览图
          </button>
        </div>
      </div>

      <!-- WebGL 渲染容器 -->
      <div id="viewport-container" class="md-canvas-container">
        <!-- 视口加载遮罩 (CAD Loading Overlay) -->
        <div id="viewport-loading" class="md-loading-overlay hidden">
          <div class="md-loading-box">
            <div class="md-loading-spinner"></div>
            <div id="loading-text" class="md-loading-text">正在进行 OpenCASCADE 实体造型...</div>
          </div>
        </div>
      </div>

      <!-- 视口底部：运行日志控制台 (多行可滚动，实时诊断) -->
      <div id="log-panel" class="md-log-panel">
        <div class="md-log-header">
          <div class="md-log-title">
            <span id="lbl-log-title">运行日志</span>
            <span id="log-status-badge" class="md-badge md-badge-info">就绪</span>
          </div>
          <div class="md-log-actions">
            <button id="btn-clear-log" class="md-btn-xs" title="清空全部日志">清空日志</button>
            <button id="btn-toggle-log" class="md-btn-xs" title="折叠或展开日志面板">收起</button>
          </div>
        </div>
        <div id="log-list" class="md-log-content">
          <!-- 动态实时日志条目 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 底部极简状态栏 (简化状态显示，零多余冗长文字) -->
  <footer class="md-status-bar">
    <div class="md-status-left">
      <span id="status-indicator" class="md-status-dot ready"></span>
      <span id="status-quick" class="md-log-text">准备就绪</span>
    </div>
    <div class="md-status-right">Plant 3D Web Studio</div>
  </footer>

  <!-- 构件预览图展示与导出弹窗 (支持标准轴测图与轴测尺寸图双出图切换) -->
  <div id="snapshot-modal" class="md-dialog-scrim hidden">
    <div class="md-dialog-container">
      <div class="md-dialog-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div id="dialog-title" class="md-dialog-title">三维出图预览</div>
          <div class="md-segmented-group">
            <button id="tab-preview-clean" class="md-segmented-item active" title="纯实体着色轴测出图 (无标注)">标准轴测图</button>
            <button id="tab-preview-annotated" class="md-segmented-item" title="带工程尺寸标注的轴测图">轴测尺寸图</button>
          </div>
        </div>
        <button id="btn-close-modal" class="md-button md-button-outlined" style="padding: 3px 8px; font-size: var(--wpf-font-size-caption);">关闭</button>
      </div>
      <div class="md-dialog-body">
        <img id="snapshot-img" class="md-snapshot-img" alt="3D Preview Snapshot">
      </div>
      <div class="md-dialog-footer">
        <div id="snapshot-info" class="md-dialog-meta">格式: PNG</div>
        <div class="md-dialog-actions">
          <button id="btn-dialog-close" class="md-button md-button-outlined">关闭</button>
          <button id="btn-download-snapshot" class="md-button md-button-primary">下载当前图</button>
          <button id="btn-download-all" class="md-button md-button-accent">下载两张 (标准+标注)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 主应用控制器脚本 -->
  <script type="module" src="./src/app.js?v=20261124_02"></script>
</body>
</html>
