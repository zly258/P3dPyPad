# -*- coding: utf-8 -*-
name: 部署 GitHub Pages 离线仿真工作台

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的必要权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个并发部署任务
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 GitHub Pages 环境
        uses: actions/configure-pages@v5

      - name: 上传 web 目录为静态站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: 部署站点至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
